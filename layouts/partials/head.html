<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}" dir="{{ .Site.Language.Params.languageDirection | default "ltr" }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <!-- ══ PRIMARY SEO ══ -->
  <title>{{ .Site.Title }} | {{ .Site.Language.Params.section1_title }} – {{ .Site.Language.Params.section3_title }}</title>
  <meta name="description" content="{{ .Site.Language.Params.description }}" />
  <meta name="keywords"    content="{{ .Site.Language.Params.keywords }}" />
  <meta name="robots"      content="index, follow, max-snippet:-1, max-image-preview:large" />
  <meta name="author"      content="{{ .Site.Title }}" />

  <!-- ══ GEO TAGS — tells Google this business is in Riyadh ══ -->
  <meta name="geo.region"      content="SA-01" />
  <meta name="geo.placename"   content="Riyadh, Saudi Arabia" />
  <meta name="geo.position"    content="24.786028;46.684167">
  <meta name="ICBM"            content="24.786028, 46.684167">

  <!-- ══ CANONICAL + HREFLANG ══ -->
  <link rel="canonical" href="{{ .Permalink }}" />
  {{ range hugo.Sites }}
  <link rel="alternate" hreflang="{{ .Language.Lang }}" href="{{ .Home.RelPermalink }}" />
  {{ end }}
  <link rel="alternate" hreflang="x-default" href="{{ .Site.BaseURL }}" />

  <!-- ══ OPEN GRAPH ══ -->
  <meta property="og:type"        content="website" />
  <meta property="og:url"         content="{{ .Permalink }}" />
  <meta property="og:title"       content="{{ .Site.Title }}" />
  <meta property="og:description" content="{{ .Site.Language.Params.description }}" />
  <meta property="og:image"       content="{{ .Site.BaseURL }}images/og.jpg" />
  <meta property="og:locale"      content="{{ .Site.Language.Lang }}" />

  <!-- ══ TWITTER CARD ══ -->
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:title"       content="{{ .Site.Title }}" />
  <meta name="twitter:description" content="{{ .Site.Language.Params.description }}" />
  <meta name="twitter:image"       content="{{ .Site.BaseURL }}images/og.jpg" />

  <!-- ══ STRUCTURED DATA — LocalBusiness with Riyadh location ══
       This is the most important SEO tag for appearing in Riyadh local search.
       Replace "telephone" with your real number.
       Replace "latitude/longitude" if your shop is in a specific Riyadh neighborhood.
  ══ -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "LocalBusiness",
    "name": "{{ .Site.Title }}",
    "description": "{{ .Site.Language.Params.description }}",
    "url": "{{ .Site.BaseURL }}",
    "telephone": "{{ .Site.Language.Params.phone }}",
    "image": "{{ .Site.BaseURL }}images/og.jpg",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "الرياض",
      "addressRegion": "منطقة الرياض",
      "addressCountry": "SA",
      "postalCode": "11564"
    },
    "geo": {
      "@type": "GeoCoordinates",
      "latitude": "24.786028",
      "longitude": "46.684167"
    },
    "areaServed": [
      { "@type": "City", "name": "الرياض" },
      { "@type": "City", "name": "Riyadh" },
      { "@type": "Place", "name": "شمال الرياض" },
      { "@type": "Place", "name": "جنوب الرياض" },
      { "@type": "Place", "name": "شرق الرياض" },
      { "@type": "Place", "name": "غرب الرياض" }
    ],
    "aggregateRating": {
      "@type": "AggregateRating",
      "ratingValue": "4.9",
      "reviewCount": "87",
      "bestRating": "5"
    },
    "priceRange": "$$",
    "openingHours": "Sa-Th 08:00-20:00",
    "hasOfferCatalog": {
      "@type": "OfferCatalog",
      "name": "{{ .Site.Language.Params.nav_sections }}",
      "itemListElement": [
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "{{ .Site.Language.Params.section1_title }}" } },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "{{ .Site.Language.Params.section2_title }}" } },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "{{ .Site.Language.Params.section3_title }}" } },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "{{ .Site.Language.Params.section4_title }}" } }
      ]
    }
  }
  </script>

  <!-- ══ PRECONNECT ══ -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- ══ CSS ══ -->
  <link rel="stylesheet" href="{{ "css/main.css" | relURL }}" />
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css" />

  <!-- ══ FAVICON ══ -->
  <link rel="icon" type="image/png" href="{{ "images/favicon.png" | relURL }}" />
</head>
<body>
